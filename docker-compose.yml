version: '3.8'

services:

  # Guard (docker-proxy) container: has access to docker.sock and guards authelia
  authelia-guard:
    image: ghcr.io/pushkinmazila2/authelia-ui:latest
    container_name: authelia-guard
    restart: unless-stopped
    command: ["guard"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN_ADDR=:2375
      - AUTHELIA_CONTAINER_NAME=authelia
      - DOCKER_SOCKET=/var/run/docker.sock
    expose:
      - "2375"

  # UI container: clean HTML interface, manages configs/database, talks to guard
  authelia-ui:
    image: ghcr.io/pushkinmazila2/authelia-ui:latest
    container_name: authelia-ui
    restart: unless-stopped
    ports:
      - "8383:8080"
    volumes:
      - authelia_db:/data/authelia_db
      - ./users_database.yml:/data/users_database.yml
      - ./configuration.yml:/data/configuration.yml
    environment:
      - LISTEN_ADDR=:8080
      - CONFIG_PATH=${CONFIG_PATH:-/config/configuration.yml}
      - NOTIFICATION_PATH=${NOTIFICATION_PATH:-/config/notification.txt}
      - USERS_PATH=${USERS_PATH:-/config/users_database.yml}
      - DB_PATH=${DB_PATH:-/config/db.sqlite3}
      - GUARD_URL=http://authelia-guard:2375
      - UI_USER=admin
      - UI_PASSWORD=adminpassword
      - API_TOKEN=my-secure-bearer-token

volumes:
  authelia_db:
